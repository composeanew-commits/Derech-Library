<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Derech Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#302070"><link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--tx:#1f1b33;--mut:#6c6879;--pri:#302070;--acc:#b8893a;--ok:#1f7a45;--okb:#e3f1e6;--bad:#a8281f;--badb:#f9e4e1;--bd:#e5decd;--sh:0 1px 3px rgba(48,32,112,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#121019;--card:#1c1927;--tx:#efeaf7;--mut:#a9a4bd;--pri:#a99ee8;--acc:#d6ac5f;--ok:#6fdc9a;--okb:#17382a;--bad:#ff958c;--badb:#42201f;--bd:#2f2b42;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#362d6e,#5a4bb0);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;color:#fff;position:sticky;top:0;z-index:5;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(54,45,110,.3)}
.top{display:flex;align-items:center;gap:10px}.top img{height:38px;background:#fff;border-radius:10px;padding:3px}.top b{font-size:20px}.top small{opacity:.8;display:block;font-size:12px;margin-top:-2px}
#q{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px 14px;font:inherit;background:rgba(255,255,255,.95);color:#1d1b3a;outline:none}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:2px 2px 8px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--bd);padding:12px;margin-bottom:10px}
.bk{display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .1s}.bk:active{transform:scale(.98)}
.cv{flex:none;width:46px;height:64px;border-radius:6px 10px 10px 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:inset 4px 0 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.2);overflow:hidden}.cv img{width:100%;height:100%;object-fit:cover}
.cv.big{width:96px;height:134px;font-size:30px}
.bk .i{flex:1;min-width:0}.t{font-weight:650;line-height:1.25}.a{color:var(--mut);font-size:14px}
.pill{flex:none;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px}.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--badb);color:var(--bad)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:650;background:var(--pri);color:#fff;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none}.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.wa{background:#1fa855}.btn:disabled{opacity:.5}
input.f{width:100%;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:13px;font:inherit;margin-top:8px;outline:none}input.f:focus{border-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:6}
nav a{flex:1;text-align:center;color:var(--mut);font-size:12px;padding:6px;border-radius:12px;cursor:pointer;text-decoration:none}nav a span{display:block;font-size:22px}nav a.on{color:var(--pri);font-weight:650}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:9;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translateX(-50%)}
.banner{background:#fff3cd;color:#664d03;padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
h2{margin:6px 2px 10px;font-size:20px}.empty{text-align:center;color:var(--mut);padding:40px 10px}.late{color:var(--bad);font-weight:650}
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.lb{border:1px dashed #999;padding:6px;text-align:center;font-size:10px;break-inside:avoid;color:#000;background:#fff;min-height:128px}.lb svg{width:88px;height:88px}
@media print{header,nav,.noprint,#toast{display:none}body{background:#fff;padding:0}main{max-width:none}}

/* restyle: library look */
:root{--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif}
header{background:#302070;border-radius:0;box-shadow:none;border-bottom:3px solid var(--acc)}
@media(prefers-color-scheme:dark){header{background:#1d1745}}
.top b,h2,.t{font-family:var(--serif)}.top b{font-size:21px;letter-spacing:.2px}h2{font-weight:700}.t{font-weight:700}
#q{border-radius:8px}.card{border-radius:8px}.btn{border-radius:8px}input.f{border-radius:8px}.chip{border-radius:8px}.pill{border-radius:6px}.banner{border-radius:6px}
.cv{border-radius:3px 6px 6px 3px;font-size:0}.cv .ct{font:600 8px/1.2 var(--serif);padding:5px 4px;text-align:center;overflow:hidden;word-break:break-word;color:#fff}.cv.big .ct{font-size:13px;padding:8px}
nav a svg{width:24px;height:24px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav a span{display:none}
nav a.on{color:var(--pri)}.chip.on{background:var(--pri);color:var(--card)}
@media(prefers-color-scheme:dark){.btn,.chip.on{color:#14102a}}

.vt{background:none;border:0;color:var(--pri);font:inherit;font-size:13px;font-weight:650;cursor:pointer;padding:0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:16px 12px;padding:4px 0 10px}
.gt{position:relative;cursor:pointer;min-width:0}.gt:active{transform:scale(.97)}
.gr .cv{width:100%;height:auto;aspect-ratio:2/3;box-shadow:inset 5px 0 0 rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.22)}.gr .cv .ct{font-size:12px;padding:10px 8px}
.gt.out .cv{opacity:.4}.gt .ob{position:absolute;top:6px;right:6px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.gn{font:600 12.5px/1.25 var(--serif);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.back{display:inline-block;color:var(--pri);font-weight:650;text-decoration:none;margin:2px 0 6px}
.hero{text-align:center;padding:4px 0 14px}.hero .cv.big{width:150px;height:auto;aspect-ratio:2/3;margin:0 auto 14px;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.28)}.hero .cv.big .ct{font-size:16px;padding:12px}
.hero h1{font:700 25px/1.2 var(--serif);margin:0 8px 4px}.hm{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}.cat{font-size:12px;font-weight:650;color:var(--pri);border:1px solid var(--bd);background:var(--card);padding:4px 10px;border-radius:6px}
.sh{font:700 15px var(--serif);margin-bottom:6px}.sy{margin:0;line-height:1.55}
.duebox{text-align:center;border-left:4px solid var(--acc)}.duebox.lt{border-left-color:var(--bad)}.dd{font:700 22px var(--serif);margin:2px 0}.duebox.lt .dd{color:var(--bad)}
.loan.lt{border-left:4px solid var(--bad)}.btn.wa{background:#1f9d55;color:#fff}
textarea.f{width:100%;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:13px;font:inherit;margin-top:8px;outline:none;resize:vertical}
</style></head><body>
<header><div class="top"><img src="logo.png" alt=""><div><b>Derech Library</b><small>Scan a book to take it out</small></div></div><input id="q" type="search" placeholder="Search title or author"></header>
<main id="app"></main>
<nav><a data-r="" ><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>Books</a><a data-r="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My books</a><a data-r="admin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Admin</a></nav>
<div id="toast"></div>
<script src="books.js"></script><script src="config.js"></script>
<script>
let B=LS0(),API=window.API_URL,$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function LS0(){try{const v=JSON.parse(localStorage.getItem("books"));if(v&&v.length)return v}catch(e){}return window.BOOKS}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAY=864e5,fmt=t=>new Date(t).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
let tok=LS.get("tok",null);if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);LS.set("tok",tok)}
let out=new Set(),mineL=[],cat="All",onlyAvail=false,adminPin="",adminData=null,busy=false;
let cats=[];const mkCats=()=>{cats=["All",...new Set(B.map(b=>b.c))]};mkCats();
let view=LS.get("view","grid");
let nb={t:"",a:"",c:"",syn:"",img:""};
async function loadBooks(){if(!API)return;try{const r=await api({action:"books"});if(r.books&&r.books.length){B=r.books;LS.set("books",B);mkCats();if(!cats.includes(cat))cat="All";render()}}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",2600)}
async function api(p){
 if(!API){const L=LS.get("demo",[]),b=p.book;
  if(p.action==="status")return{out:L.map(x=>x.book)};
  if(p.action==="mine")return{mine:L.filter(x=>x.token===p.token)};
  if(p.action==="take"){L.push({book:b,title:p.title,name:p.name,phone:p.phone,token:p.token,out:Date.now(),due:Date.now()+7*DAY});LS.set("demo",L);return{ok:1}}
  if(p.action==="return"||p.action==="adminreturn"){LS.set("demo",L.filter(x=>x.book!==b));return{ok:1}}
  if(p.action==="extend"){const x=L.find(y=>y.book===b);if(x)x.due+=7*DAY;LS.set("demo",L);return{ok:1}}
  if(p.action==="admin")return{loans:L}}
 const r=await fetch(API+"?"+new URLSearchParams(p));return r.json()}
async function refresh(){try{const[s,m]=await Promise.all([api({action:"status"}),api({action:"mine",token:tok})]);out=new Set(s.out||[]);mineL=m.mine||[];render()}catch(e){toast("Can't reach the library server")}}
const col=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},32%,30%)`};
const ini=t=>t.replace(/^(the|a|an)\s+/i,"").slice(0,2).toUpperCase();
const cover=(b,big)=>`<div class="cv ${big?"big":""}" style="background:${col(b.t)}">${b.img?`<img src="${esc(b.img)}" alt="">`:`<span class="ct">${esc(b.t.slice(0,48))}</span>`}</div>`;
const pill=id=>out.has(id)?'<span class="pill no">Out</span>':'<span class="pill ok">Available</span>';
function route(){return location.hash.slice(1)}
function render(){const h=route(),a=$("app");document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.r===(h==="mine"||h==="admin"?h:"")&&!h.startsWith("b-")||(h.startsWith("b-")&&x.dataset.r==="")));
 $("q").parentElement.style.display=(h===""||h.startsWith("b-"))?"":"none";
 const ban=API?"":'<div class="banner">Demo mode: nothing is shared yet. Finish the setup in the README.</div>';
 if(h.startsWith("b-")){const b=B.find(x=>x.id===h);a.innerHTML=ban+(b?book(b):'<div class="empty">Book not found</div>')}
 else if(h==="mine")a.innerHTML=ban+mine();
 else if(h==="admin")a.innerHTML=admin();
 else if(h==="labels")a.innerHTML=labels();
 else a.innerHTML=ban+home()}
function home(){const q=$("q").value.toLowerCase().trim();
 const l=B.filter(b=>(cat==="All"||b.c===cat)&&(!onlyAvail||!out.has(b.id))&&(b.t+" "+b.a).toLowerCase().includes(q));
 return`<div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}<button class="chip ${onlyAvail?"on":""}" id="av">✓ Available only</button></div>
 <div class="meta"><span>${l.length} books · ${out.size} out</span><button class="vt" data-v="1">${view==="grid"?"☰ List":"▦ Shelf"}</button></div>`+
 (view==="grid"?`<div class="gr">${l.map(b=>`<div class="gt ${out.has(b.id)?"out":""}" data-b="${b.id}">${cover(b)}${out.has(b.id)?'<span class="ob">Out</span>':""}<div class="gn">${esc(b.t)}</div></div>`).join("")}</div>${l.length?"":'<div class="empty">No books match</div>'}`:
 (l.map(b=>`<div class="card bk" data-b="${b.id}">${cover(b)}<div class="i"><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)||"&nbsp;"}</div></div>${pill(b.id)}</div>`).join("")||'<div class="empty">No books match</div>'))}
function book(b){const mine=mineL.find(x=>x.book===b.id),o=out.has(b.id),me=LS.get("me",{name:"",phone:""});
 const dl=mine?Math.ceil((mine.due-Date.now())/DAY):0,late=mine&&mine.due<Date.now();
 return`<a class="back" href="#">← All books</a>
 <div class="hero">${cover(b,1)}<h1>${esc(b.t)}</h1>${b.a?`<div class="a">${esc(b.a)}</div>`:""}<div class="hm"><span class="cat">${esc(b.c)}</span>${pill(b.id)}</div></div>
 ${b.syn?`<div class="card"><div class="sh">About this book</div><p class="sy">${esc(b.syn)}</p></div>`:""}
 ${adminData?`<div class="card"><div class="sh">Admin: cover</div><input class="f" id="ci" placeholder="Cover image link (https://…)" value="${esc(b.img||"")}"><button class="btn sec" data-do="autocover">🔍 Auto-find cover</button><button class="btn sec" data-do="gimg">🖼 Google Images</button><button class="btn" data-do="setcover">Save cover</button></div>`:""}
 ${mine?`<div class="card duebox ${late?"lt":""}"><div class="a">${late?"Overdue":"You have this book"}</div><div class="dd">${late?"Was due ":"Due "}${fmt(mine.due)}</div><div class="a">${late?"Please return it soon":dl<=1?"Due very soon":dl+" days left"}</div></div><button class="btn" data-do="return">↩ Return this book</button><button class="btn sec" data-do="extend">+1 week</button>`
 :o?`<div class="card a">Someone has this book right now. Check back soon!</div>`
 :`<div class="card"><div class="sh">Take it out for 7 days</div><input class="f" id="nm" placeholder="Your name" value="${esc(me.name)}" autocomplete="name"><input class="f" id="ph" type="tel" placeholder="WhatsApp number" value="${esc(me.phone)}" autocomplete="tel"><button class="btn" data-do="take">📖 Take out</button></div>`}`}
function mine(){return`<h2>My books</h2>`+(mineL.length?mineL.map(m=>{const b=B.find(x=>x.id===m.book)||{t:m.book,a:"",id:m.book};return`<div class="card bk" data-b="${b.id}">${cover(b)}<div class="i"><div class="t">${esc(b.t)}</div><div class="a ${m.due<Date.now()?"late":""}">${m.due<Date.now()?"Overdue, was due ":"Due "}${fmt(m.due)}</div></div></div>`}).join(""):'<div class="empty">You have no books out 🎉</div>')}
function waLink(l){let p=String(l.phone||"").replace(/\D/g,"");if(p.startsWith("0"))p="972"+p.slice(1);if(!p)return"";const late=l.due<Date.now();
 const m=late?`Hi ${l.name}, a friendly reminder from the Derech library: "${l.title}" was due back ${fmt(l.due)}. Could you please return it when you can? Thank you!`:`Hi ${l.name}, a friendly reminder from the Derech library: "${l.title}" is due back ${fmt(l.due)}. Thanks!`;
 return"https://wa.me/"+p+"?text="+encodeURIComponent(m)}
function loanCard(l){const w=waLink(l),late=l.due<Date.now(),d=Math.max(1,Math.floor(Math.abs(l.due-Date.now())/DAY));
 return`<div class="card loan ${late?"lt":""}"><div class="t">${esc(l.title)}</div><div>${esc(l.name)} · ${esc(l.phone||"no phone")}</div><div class="a ${late?"late":""}">${late?"OVERDUE by "+d+" day"+(d>1?"s":"")+" · was due "+fmt(l.due):"Due "+fmt(l.due)}</div>${w?`<a class="btn wa" target="_blank" rel="noopener" href="${w}">💬 Send WhatsApp reminder</a>`:'<div class="a">No phone number saved</div>'}<button class="btn sec" data-ar="${esc(l.book)}">Mark returned</button></div>`}
function admin(){if(!adminData)return`<h2>Admin</h2><div class="card"><input class="f" id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button class="btn" data-do="login">Open</button></div>`;
 const L=[...adminData].sort((a,b)=>a.due-b.due),od=L.filter(l=>l.due<Date.now()).length;
 return(od?`<h2><span class="late">Overdue (${od})</span></h2>`+L.filter(l=>l.due<Date.now()).map(loanCard).join(""):"")+(L.length-od?`<h2>Out now (${L.length-od})</h2>`+L.filter(l=>l.due>=Date.now()).map(loanCard).join(""):"")+(L.length?"":'<div class="empty">Nothing is out</div>')+`<a class="btn" href="#labels">🏷 Print QR labels</a>
 <h2>Add a book</h2><div class="card"><input class="f" id="nt" placeholder="Title" value="${esc(nb.t)}"><input class="f" id="na" placeholder="Author (optional)" value="${esc(nb.a)}"><button class="btn sec" data-do="lookup">🔍 Look up details & cover</button>
 <input class="f" id="nc" list="cl" placeholder="Category" value="${esc(nb.c)}"><datalist id="cl">${cats.slice(1).map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
 <textarea class="f" id="ns" rows="4" placeholder="Synopsis">${esc(nb.syn)}</textarea><button class="btn sec" data-do="gimg">🖼 Find cover on Google Images</button><input class="f" id="ni" placeholder="Paste cover image link (https://…)" value="${esc(nb.img)}">${nb.img?`<div style="margin:6px 0"><img src="${esc(nb.img)}" alt="" style="height:90px;border-radius:6px"></div>`:""}${nb.warn?`<div class="late">⚠ Marked mature by Google Books. It will be saved hidden from students.</div>`:""}
 <button class="btn" data-do="addbook">➕ Save to library</button></div>`}
const qr=u=>{const q=qrcode(0,"M");q.addData(u);q.make();return q.createSvgTag(3,0)};
function labels(){const base=location.href.split("#")[0];return`<div class="noprint"><button class="btn" onclick="print()">🖨 Print / save as PDF</button><a class="btn sec" href="#admin">← Back</a></div><div class="labels"><div class="lb"><b>DERECH LIBRARY</b><br>Scan to take a book out${qr(base)}</div>`+B.map(b=>`<div class="lb">${qr(base+"#"+b.id)}<br>${esc(b.t)}<br>${b.id}</div>`).join("")+"</div>"}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-b],[data-c],#av,[data-do],[data-ar],[data-v],nav a");if(!t)return;
 if(t.dataset.v){view=view==="grid"?"list":"grid";LS.set("view",view);render()}
 else if(t.dataset.b){location.hash=t.dataset.b;scrollTo(0,0)}
 else if(t.dataset.c){cat=t.dataset.c;render()}
 else if(t.id==="av"){onlyAvail=!onlyAvail;render()}
 else if(t.matches("nav a")){location.hash=t.dataset.r;scrollTo(0,0)}
 else if(t.dataset.ar){if(confirm("Mark returned?")){await api({action:"adminreturn",pin:adminPin,book:t.dataset.ar});await loadAdmin();refresh()}}
 else if(t.dataset.do){if(busy)return;busy=true;t.disabled=true;try{await act(t.dataset.do)}catch(x){toast("Something went wrong, try again")}busy=false;render()}});
async function loadAdmin(){const r=await api({action:"admin",pin:adminPin});if(r.error){adminData=null;toast(r.error)}else adminData=r.loans}
async function findCover(t,a){try{const r=await(await fetch("https://openlibrary.org/search.json?limit=1&title="+encodeURIComponent(t)+(a?"&author="+encodeURIComponent(a):""))).json();const d=r.docs&&r.docs[0];if(d&&d.cover_i)return"https://covers.openlibrary.org/b/id/"+d.cover_i+"-M.jpg"}catch(e){}
 try{const r=await(await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=1&q="+encodeURIComponent("intitle:"+t))).json();const v=r.items&&r.items[0]&&r.items[0].volumeInfo;if(v&&v.imageLinks)return(v.imageLinks.thumbnail||"").replace("http:","https:")}catch(e){}return""}
function readNb(){nb.t=$("nt").value.trim();nb.a=$("na").value.trim();nb.c=$("nc").value.trim();nb.syn=$("ns").value.trim();if($("ni"))nb.img=$("ni").value.trim()}
async function act(d){const id=route();
 if(d==="gimg"){readNb();const t=route().startsWith("b-")&&b?b.t+" "+(b.a||""):nb.t+" "+nb.a;if(!t.trim())return toast("Enter a title first");open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(t+" book cover"),"_blank");return}
 if(d==="autocover"){const u=await findCover(b.t,b.a);if(u){$("ci").value=u;toast("Found a cover. Tap Save cover.")}else toast("No cover found, try Google Images");return}
 if(d==="setcover"){const u=$("ci").value.trim();if(u&&!/^https:\/\//.test(u))return toast("Link must start with https://");
  const r=await api({action:"setcover",pin:adminPin,book:id,img:u});if(r.error)return toast(r.error);b.img=u;LS.set("books",B);toast("Cover saved");return}
 if(d==="lookup"){readNb();if(!nb.t)return toast("Enter a title first");
  const q="intitle:"+nb.t+(nb.a?"+inauthor:"+nb.a:"");let v=null;
  try{const r=await(await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=1&q="+encodeURIComponent(q).replace(/%2B/g,"+"))).json();v=r.items&&r.items[0]&&r.items[0].volumeInfo}catch(e){}
  if(v){nb.t=v.title||nb.t;if(!nb.a)nb.a=(v.authors||[]).join(", ");nb.syn=(v.description||nb.syn||"").replace(/<[^>]+>/g,"").slice(0,500);
   nb.img=v.imageLinks?(v.imageLinks.thumbnail||"").replace("http:","https:"):"";nb.warn=v.maturityRating==="MATURE";if(!nb.c&&v.categories)nb.c=v.categories[0]}
  if(!nb.img)nb.img=await findCover(nb.t,nb.a);
  toast(v||nb.img?(nb.img?"Found it. Check and save.":"Found details, no cover. Try Google Images."):"Nothing found, fill it in by hand");return}
 if(d==="addbook"){readNb();if(!nb.t)return toast("Enter a title");
  const r=await api({action:"addbook",pin:adminPin,t:nb.t,a:nb.a,c:nb.c,syn:nb.syn,img:nb.img,status:nb.warn?"hidden":""});if(r.error)return toast(r.error);
  toast("Saved as "+r.id);nb={t:"",a:"",c:"",syn:"",img:""};await loadBooks();return}const b=B.find(x=>x.id===id);
 if(d==="login"){adminPin=$("pin").value;await loadAdmin();return}
 if(d==="take"){const name=$("nm").value.trim(),phone=$("ph").value.trim();if(!name)return toast("Please enter your name");
  const r=await api({action:"take",book:id,title:b.t,name,phone,token:tok});if(r.error)return toast(r.error);LS.set("me",{name,phone});toast("Taken! Due in 7 days 📖");await refresh();location.hash="mine"}
 if(d==="return"){const r=await api({action:"return",book:id,token:tok});if(r.error)return toast(r.error);toast("Returned. Thank you! ✅");await refresh();location.hash=""}
 if(d==="extend"){const r=await api({action:"extend",book:id,token:tok});if(r.error)return toast(r.error);toast("Extended one week");await refresh()}}
$("q").addEventListener("input",()=>{if(route()!==""&&!route().startsWith("b-"))return;if(route().startsWith("b-"))location.hash="";render();$("q").focus()});
addEventListener("change",e=>{if(e.target.id==="ni"){readNb();render()}});
addEventListener("hashchange",()=>{if(route()==="admin"&&adminPin&&!adminData)loadAdmin().then(render);else if(route()==="admin"&&adminPin)loadAdmin().then(render);render()});
render();loadBooks();refresh();setInterval(()=>{if(!busy&&document.visibilityState==="visible")refresh()},30000);
</script></body></html>
